<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tab caps in grayscale: no colored subpixel fringes on their edges -->
<fontconfig>
  <match target="font">
    <test name="family">
      <string>Kasui92 Tab Caps</string>
    </test>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>
</fontconfig>
