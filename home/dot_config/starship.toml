add_newline = false
command_timeout = 200
format = "${custom.bwlock}[$directory$git_branch$git_status]($style)$character"

# Lock while the SSH agent is reachable but holds no keys
[custom.bwlock]
when = 'command -v bw >/dev/null && { ssh-add -l >/dev/null 2>&1; [ $? -eq 1 ]; }'
shell = ["bash", "--noprofile", "--norc"]
symbol = "\uf023"
format = "[$symbol  ]($style)"
style = "bold yellow"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic red"

[git_status]
format     = '[$all_status]($style)'
style      = "yellow"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
